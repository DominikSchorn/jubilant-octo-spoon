name: Check SemVer Compliance

on:
  push:
    paths:
      - '**'  # Check all files or specify your paths here

jobs:
  check-semver:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get changed lines
      id: changed-lines
      uses: hestonhoffman/changed-lines@v1

    - name: Check SemVer compliance
      run: ./.github/scripts/check_semver.sh
      env:
        CHANGED_LINES: ${{ steps.changed-lines.outputs.lines }}
