name: Check SemVer Compliance

on:
  push:
    paths:
      - '**'  # Check all files or specify your paths here

jobs:
  check-semver:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Check SemVer compliance
      run: ./.github/scripts/check_semver.sh
